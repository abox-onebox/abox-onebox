# ============================================================
# ABox 一盒 · 宿主机 443（HTTPS）站点配置
#
# 部署位置：/etc/nginx/conf.d/abox-443.conf（宿主机 nginx，非容器内）
# 生效方式：nginx -t && systemctl reload nginx
#
# 职责：
#   /api/                    → 127.0.0.1:8081（h5 容器 nginx → api:3000），小程序正式包走这里
#   /wecom/kb/               → 127.0.0.1:8080（admin 容器 nginx → api:3000），企微回调
#   /WW_verify_*.txt 等      → 本地 webroot，企微域名归属校验文件
#   其余                     → 404
#
# ⚠️ 为什么企微回调走 8080 而不是 8081（2026-11-10 实测）：
#   · WecomKbController 是 @Controller('wecom/kb')，main.ts 用
#     setGlobalPrefix(prefix, { exclude: ['wecom/(.*)'] }) 把它挂在**裸路径**
#     /wecom/kb/callback，不带 /api/v1。
#   · 只有 apps/admin-web/nginx.conf 里有 location /wecom/ { proxy_pass http://api:3000; }；
#     apps/miniprogram/nginx.conf（h5 / 8081）**没有**该块，且 location / 有 Cookie 闸门
#     ⇒ 走 8081 会被 401 挡掉，表现为「企微后台 URL 校验失败」。
#   · api:3000 只在 compose 网络内暴露，宿主机直连 127.0.0.1:3000 不通，
#     故借 8080 容器 nginx 做二次转发——不改 compose、不重建容器。
#
# ⚠️ proxy_pass 末尾**不能加 /**（写成 http://127.0.0.1:8080/ 会把 /wecom/kb/
#    前缀替换掉，后端收到 /callback 而 404）。必须保留原始 URI 原样转发。
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.xunlizhinian.cn;

    ssl_certificate     /etc/letsencrypt/live/api.xunlizhinian.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xunlizhinian.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;
    access_log /var/log/nginx/abox-api.access.log;
    error_log  /var/log/nginx/abox-api.error.log;

    # ---------- 小程序 / 后台 API（原有，保持不变）----------
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;
    }

    # ---------- 企业微信 KB 助手回调（裸路径，2026-11-10 补）----------
    # GET  = 企微后台填 URL 时的握手（返回解密后的 echostr 明文）
    # POST = 同事发消息（后端验签解密后 200 空体，结果异步主动下发）
    # 端点 @Public()，鉴权靠 WXBizMsgCrypt 签名验真（msg_signature + AES），
    # 故必须 request_buffering off 保证 XML 原文完整透传给 Nest 侧 rawBody。
    location ^~ /wecom/kb/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;
    }

    # ---------- 企微域名归属校验文件（80 webroot 同目录）----------
    # 企微后台配置回调 URL 时会 GET https://<域名>/WW_verify_*.txt 校验归属；
    # 原先只有 80 能取到，443 是 404 ⇒ URL 保存不过。这里只放行白名单文件名，
    # 不把整个 webroot 暴露到 443（其余仍走 location / 的 404）。
    location ~ ^/(WW_verify_[A-Za-z0-9]+\.txt|_health\.txt)$ {
        root         /opt/abox-wecom-verify;
        default_type "text/plain";
        try_files    $uri =404;
        access_log   off;
    }

    # Let's Encrypt 续期走 80 的 HTTP-01（certbot --webroot），443 不需要；
    # 这里保留 404，避免把 webroot 的其他内容暴露出去。
    location / {
        return 404;
    }
}

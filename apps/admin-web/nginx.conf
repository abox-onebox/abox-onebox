# ============================================================
# ABox 一盒 · 运营后台站点配置（M5-0）
#
# 用法：由 apps/admin-web/Dockerfile 拷到 /etc/nginx/conf.d/default.conf
# 职责：托管静态产物 + 反代 /api 与 /static 到 api 服务
# ============================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 后台要传商品图 / 凭证图，默认 1m 会 413
    client_max_body_size 20m;

    # ---------- 安全响应头 ----------
    # 后台是高权限面，这几个头是底线（不替代 CSP，CSP 需按实际资源域再定）
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer"    always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 微信支付 V3 回调要拿**原始报文**验签（Nest 侧开了 rawBody）。
        #    关掉请求缓冲，避免报文先落盘再转发带来的时序/大小差异；
        #    nginx 本身不改写 body，这里只是把「不缓冲」显式化。
        proxy_request_buffering off;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }

    # ---------- 本地存储的图片（STORAGE_DRIVER=local 时由 api 暴露）----------
    location /static/ {
        proxy_pass       http://api:3000;
        proxy_set_header Host $host;
        # 内容按哈希命名，可长缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 静态资源 ----------
    # vite 产物按内容哈希命名（index-<hash>.js），内容变则文件名变 → 可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠️ index.html **绝不缓存**：
    #    它是「指向哪个 assets 哈希」的唯一入口。缓存了它，发版后用户浏览器
    #    会拿旧 index 去请求已被删除的旧 assets → 白屏，且**刷新也修不好**
    #    （因为 index 又被缓存了一次）。这是最经典的发版事故，务必保持 no-store。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ---------- SPA fallback ----------
    # 后台用 history 路由，刷新子路由（如 /finance/withdrawal）必须回 index.html，
    # 否则 nginx 直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# ABox 一盒 · 运营后台站点配置（M5-0）
#
# 用法：由 apps/admin-web/Dockerfile 拷到 /etc/nginx/conf.d/default.conf
# 职责：托管静态产物 + 反代 /api 与 /static 到 api 服务
# ============================================================

# ---------- 溯源日志格式（2026-10-27 定）----------
# 默认 `combined` 里没有 `reqLen`（请求体大小）。复盘时「那次请求到底带了多大的体」
# 只能靠它判定 —— 缺了就只剩猜。字段含义与注意点见 apps/miniprogram/nginx.conf 同段注释。
log_format abox_trace escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"reqLen":$request_length,'
    '"respLen":$body_bytes_sent,'
    '"reqTimeSec":$request_time,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent"'
    '}';

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 后台要传商品图 / 凭证图，默认 1m 会 413
    client_max_body_size 20m;

    # 同 H5：文件那份落挂载目录保留 7 天；stderr 那份保住 `docker logs` 的既有习惯。
    access_log /var/log/nginx/access.log abox_trace;
    access_log /dev/stderr abox_trace;

    # ---------- 安全响应头 ----------
    # 后台是高权限面，这几个头是底线（不替代 CSP，CSP 需按实际资源域再定）
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer"    always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- ⚠️ 生产止血：拦截免鉴权的 mock 改单端点（大小写 / 尾斜杠不敏感）----------
    # `POST /api/v1/pay/mock/paid` 是 `@Public()` **免鉴权**端点，它唯一的内部防线是
    # `!this.wxpay.isMock` 抛 10004 —— 而 `PROVIDER_MODE=mock` 下 `isMock === true`，
    # 该防线**恒不成立** ⇒ 任意订单可被任意人标记为已支付，且运行期毫无症状。
    # 该端点只服务于本地开发与 e2e 联调，**生产永远不会用到**，故在 nginx 层直接拦死。
    #
    # ⚠️ 为什么必须是 `~*` 正则、不能是 `location =` 字面量（2026-10-27 双端口实测）：
    #   NestJS 路由**大小写不敏感**，而 `location =` 是大小写**敏感**的字面量 ⇒ 只挡小写原样。
    #   修复前实测（8080 与 8081 同结果，均为 POST + 合法但不存在的 orderNo）：
    #     /api/v1/pay/mock/paid   → 404 nginx                      ← 只有它挡住了
    #     /api/v1/pay/MOCK/paid   → 200 {"code":30010,"订单不存在"}  ← 已穿到业务层
    #     /api/v1/pay/MoCK/paid   → 200 {"code":30010,...}
    #     /api/v1/pay/mock/PAID   → 200 {"code":30010,...}
    #     /api/v1/pay/mock/paid/  → 200 {"code":30010,...}          ← 尾斜杠同样绕过
    #     /api/v1/pay/MOCK/paid/  → 200 {"code":30010,...}
    #   30010 出自 `payAmountFenOf`，说明请求**已通过 `!isMock` 判据**并进入查单 ——
    #   换成真实单号即为 201 {"code":0}，订单被免鉴权改成已支付。
    #   `~*` 使整条路径大小写不敏感；`(/|%2f)?$` 吃掉尾斜杠与编码斜杠。
    #   `.`/`..` 点段与 `%6d` 之类字符编码由 nginx 的 complex_uri 归一化**先**处理掉，
    #   归一化后的 `$uri` 才是 location 匹配的对象 ⇒ 那两类变形被本段一并覆盖。
    #
    # ⚠️ 位置纪律：本段是**唯一的正则 location**，故放置顺序无歧义；
    #   但它是正则、优先级高于 `location /api/` 前缀匹配（后者没有 `^~`），
    #   因此**不要**给 `location /api/` 加 `^~` —— 加了本段就失效。
    #
    # 为什么用 404 而不是 403：404 由 nginx 直接返回，**不进入 Nest 路由** ⇒ 不产生业务
    # 日志、不返回任何可辨识的业务码，探测者拿不到「这里确实有东西」的信号。
    #
    # ⚠️ 后台站点（8080）与 H5 站点（8081）是**两条独立通路**，都能反代到 api:3000，
    #    因此**两个 nginx.conf 必须同时加本段**，只改一处等于没止血。
    #
    # ⚠️ 维护提醒：这不是永久方案。拿到微信支付真参数后应
    #   改 `PROVIDER_MODE=real` → 删掉 `ALLOW_MOCK_IN_PROD` → 本段即可一并移除。
    location ~* ^/api/v1/pay/mock/paid(/|%2f)?$ {
        access_log off;
        return 404;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 微信支付 V3 回调要拿**原始报文**验签（Nest 侧开了 rawBody）。
        #    关掉请求缓冲，避免报文先落盘再转发带来的时序/大小差异；
        #    nginx 本身不改写 body，这里只是把「不缓冲」显式化。
        proxy_request_buffering off;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }

    # ---------- 本地存储的图片（STORAGE_DRIVER=local 时由 api 暴露）----------
    location /static/ {
        proxy_pass       http://api:3000;
        proxy_set_header Host $host;
        # 内容按哈希命名，可长缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 企业微信 KB 助手回调（路线 B 对话机器人）----------
    # 企业微信服务器把同事发的消息 POST 到 /wecom/kb/callback，由 api-server 的
    # WecomKbController 验签解密后调内部 op 代理。该端点标了 @Public()，
    # 鉴权改靠 WXBizMsgCrypt 签名验真（不走全局 JwtAuthGuard）。
    # 与 /api/ 同理：关掉请求缓冲，保证原始报文完整透传给 Nest 侧 rawBody 验签
    # （WXBizMsgCrypt 的 msg_signature 依赖报文原文 + query 参数，缓冲改写会验签失败）。
    location /wecom/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }

    # ---------- 静态资源 ----------
    # vite 产物按内容哈希命名（index-<hash>.js），内容变则文件名变 → 可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠️ index.html **绝不缓存**：
    #    它是「指向哪个 assets 哈希」的唯一入口。缓存了它，发版后用户浏览器
    #    会拿旧 index 去请求已被删除的旧 assets → 白屏，且**刷新也修不好**
    #    （因为 index 又被缓存了一次）。这是最经典的发版事故，务必保持 no-store。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ---------- SPA fallback ----------
    # 后台用 history 路由，刷新子路由（如 /finance/withdrawal）必须回 index.html，
    # 否则 nginx 直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

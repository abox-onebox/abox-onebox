# ============================================================
# ABox 一盒 · 用户端 H5 站点配置
#
# 用法：由 apps/miniprogram/Dockerfile 拷到 /etc/nginx/conf.d/default.conf
# 职责：托管 H5 静态产物 + 反代 /api 与 /static 到 api 服务
#
# ⚠️ 为什么必须反代 /api（而不是让前端直连 8080）：
#   后端 CORS 是**白名单制**（main.ts `corsOriginOf` 读 app.corsOrigins），
#   跨域请求会被直接拦掉。前端因此构建为同源相对路径 `/api/v1`，
#   由本站点转发到 api:3000 —— 既无跨域问题，也不把后端端口暴露给公网。
# ============================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer"    always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与后台同口径：微信支付 V3 回调要拿原始报文验签（Nest 侧开了 rawBody）
        proxy_request_buffering off;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }

    # ---------- ⚠️ 路径冲突：前端自己的 static/ 必须排在反代之前 ----------
    # uni-app H5 产物自带 `static/`（构建后含 static/fonts/ab-kaiti.woff2 品牌楷体），
    # 而后端也把上传目录挂在同一前缀 `/static/`（main.ts `useStaticAssets`）。
    # nginx 前缀匹配取**最长**的一条，故这里用更长前缀把前端资源留在本地，
    # 其余 /static/ 才反代给 api。
    # ⚠️ 维护提醒：将来前端若在 static/ 下新增别的子目录，**必须同步补一条**，
    #    否则那些文件会被下面的反代吃掉（表现为字体/图片 404，且日志只在 api 侧）。
    location /static/fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 本地存储的图片（STORAGE_DRIVER=local 时由 api 暴露）----------
    location /static/ {
        proxy_pass       http://api:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 静态资源 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠️ index.html 绝不缓存（同后台口径）：
    #    缓存了它，发版后浏览器会拿旧 index 去请求已删除的旧 assets → 白屏
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ---------- SPA fallback ----------
    # uni-app H5 默认是 hash 路由，但 manifest 一旦改成 history，
    # 刷新子路由就必须回 index.html，否则 nginx 直接 404。
    # 这里提前兜住，避免将来改路由模式时踩这个坑。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

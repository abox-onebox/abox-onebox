# ============================================================
# ABox 一盒 · 用户端 H5 站点配置
#
# 用法：由 apps/miniprogram/Dockerfile 拷到 /etc/nginx/conf.d/default.conf
# 职责：托管 H5 静态产物 + 反代 /api 与 /static 到 api 服务
#
# ⚠️ 为什么必须反代 /api（而不是让前端直连 8080）：
#   后端 CORS 是**白名单制**（main.ts `corsOriginOf` 读 app.corsOrigins），
#   跨域请求会被直接拦掉。前端因此构建为同源相对路径 `/api/v1`，
#   由本站点转发到 api:3000 —— 既无跨域问题，也不把后端端口暴露给公网。
# ============================================================

# ---------- 溯源日志格式（2026-10-27 定）----------
#
# 为什么要有这份自定义格式：默认的 `combined` 里**没有请求体大小**。
# 事故复盘时最想知道的正是「那次 GET 到底带了多大的请求体」——
# 而上线的订单详情 JSON 解析报错（`Unexpected token '"'`）恰恰需要这个数字来判定
# 「端上真的发了一个 body」还是「某个中间层塞进去的」。没有它，这条只能靠猜。
#
# ⚠️ `$request_length` 是**请求行 + 请求头 + 请求体**的总字节数，不是纯 body 大小。
#   判「有没有带 body」要拿它跟同形态的无体请求**比**，不能看绝对值。
#   （要精确 body 大小得用 `$content_length`，但 GET 常常不带这个头 ⇒ 会是 `-`。）
#
# ⚠️ `escape=json`：UA / URI 里随时可能出现引号与反斜杠，不转义会让整行 JSON 坏掉 ——
#    而坏掉的那一行**正好是最需要看的那一行**（畸形请求）。
log_format abox_trace escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"reqLen":$request_length,'
    '"respLen":$body_bytes_sent,'
    '"reqTimeSec":$request_time,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent"'
    '}';

# ---------- ⚠️ H5 临时访问控制：Cookie 闸门（2026-10-27 定 · 可撤）----------
#
# 【为什么要有这道闸】本站点是 `--mode development` 构建，`?devCode=<任意>` 可
#   **免密切换任意身份**（不发任何网络请求），而 8081 对外开放 ⇒ 任何扫到端口的人
#   都能冒充任意用户下单 / 提现。测试专家把它列为 P0。
#
# 【为什么是 Cookie 而不是基本认证】——基本认证在这类 SPA 上**会直接失效**：
#   浏览器一旦被 JS 用 `Authorization: Bearer <jwt>` 覆盖掉 Authorization 头，
#   就不再带 Basic 凭据 ⇒ nginx 回 401。实测（2026-10-27，8081）：
#     · 仅 `-u`（不带 Bearer）：`GET /api/v1/health/ready` -> **200**
#     · `-u` + `Authorization: Bearer`：`GET /api/v1/orders` -> **401**
#   也就是「首页能开、一登录就全挂」。这比不设防更糟：它会让人以为是业务挂了，
#   从而去查一个不存在的故障。Cookie 与 Authorization 头互不干扰，故改用 Cookie。
#
# 【为什么不是 IP 白名单】异地同事的家宽 / 手机热点 IP 不固定 ⇒ 必然误伤。
#
# 【为什么不是换端口】端口扫描几分钟就能找到，它带来的只是「看起来做了点什么」。
#
# 【凭据放哪 · 怎么发 / 怎么换 / 怎么撤】见本文件末尾「闸门运维」一段。
#   一句话：凭据在 `deploy/h5/gate.d/*.conf`（挂载进来、**不在 git 里**），
#   通配 `include` 的好处是**文件缺失时 nginx 照常启动**，只是无人能过闸
#   （fail-closed）—— 这正是想要的失败方向。
map $cookie_abox_gate $abox_gate_ok {
    default      0;
    include /etc/nginx/conf.d/gate.d/*.conf;
}
# 首次换取 Cookie：`?gate=<凭据>` ⇒ 302 回 `/`（地址栏里的凭据随即被抹掉）
map $arg_gate $abox_gate_grant {
    default      0;
    include /etc/nginx/conf.d/gate.d/*.conf;
}
# 容器自身 healthcheck（wget http://127.0.0.1/）必须放行，否则容器被判 unhealthy
map $remote_addr $abox_gate_local {
    default      0;
    '127.0.0.1'  1;
}
# 上面三个来源**任一**命中即放行（值是三者拼接，`~1` = 含 1 即过）
map "$abox_gate_ok:$abox_gate_local:$abox_gate_grant" $abox_gate_pass {
    default      0;
    '~1'         1;
}
# 换完 Cookie 要跳回首页。**必须显式带上端口**：`return 302 /` 这种相对写法
# 会被 nginx 用 `$host`（**已剥端口**）拼成 `http://<域名>/` ⇒ 异地同事被甩到 80 端口，
# 表现为「链接点了没反应」。实测（2026-10-27）：
#   `Host: 1.2.3.4:8081` + `return 302 /` ⇒ `Location: http://1.2.3.4/`（端口丢了）
# 故这里用 `$http_host`（**带**端口的 Host 原值）自己拼。空 Host（HTTP/1.0）兜 `$host`。
map $http_host $abox_gate_home {
    default      $scheme://$http_host/;
    ''           $scheme://$host/;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # 双写：文件那份**落宿主机、保留 7 天**供事后溯源（见 deploy/cron/abox-ops.cron
    # 的清理行）；stderr 那份保留「`docker logs` 能实时看」的既有习惯。
    # ⚠️ 容器是 `read_only: true`，故文件那份必须落在**挂载**目录里 ——
    #    挂载由 docker-compose.prod.yml 的 `${ABOX_NGINX_LOG_DIR:-./logs/nginx-h5}` 提供。
    access_log /var/log/nginx/access.log abox_trace;
    access_log /dev/stderr abox_trace;

    # ---------- 闸门生效点（凭据与判据见本文件上方的「Cookie 闸门」段）----------
    # ⚠️ 2026-10-28 起，「不放行就 401」这条**不再放在 server 级**，已挪进 `location /`。
    #
    # 为什么挪（本条是实打实的线上缺陷，不是风格调整）：
    #   server 级 `if` 覆盖**全部 location**，连 `/api/` 与 `/static/` 一并被挡 ⇒
    #   ① 微信小程序整端打不开（唤不起任何接口）；
    #   ② 商品图全部 401 ⇒ 小程序里套餐图、菜品图一张都加载不出来。
    #   两者都不是 H5 页面本身的问题，故「闸门是为了保护 H5」这个理由**不成立**：
    #   闸门保护的对象是 `location /` 渲染出来的页面，就该只作用在它身上。
    # ⇒ 闸门下沉到 `location /`；`/api/` 与 `/static/` 的安全性仍由各自原有的
    #   JWT / `location ~* ^/api/v1/pay/mock/paid` 拦截保证，不依赖这道 Cookie。
    #
    # ⚠️ `if` 为何必须待在 `location` 里（而不是 server 级）：`add_header` 的允许范围是
    #    `http / server / location / if in location`，**不包括 `if in server`**。
    #    把它写在 server 级的 if 里，nginx 直接 `[emerg] "add_header" directive is not
    #    allowed here` 并**起不来**（站点全挂、容器 restart 循环）—— 已实测踩过一次。

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer"    always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- ⚠️ 生产止血：拦截免鉴权的 mock 改单端点（大小写 / 尾斜杠不敏感）----------
    # `POST /api/v1/pay/mock/paid` 是 `@Public()` **免鉴权**端点，它唯一的内部防线是
    # `!this.wxpay.isMock` 抛 10004 —— 而 `PROVIDER_MODE=mock` 下 `isMock === true`，
    # 该防线**恒不成立** ⇒ 任意订单可被任意人标记为已支付，且运行期毫无症状。
    # 该端点只服务于本地开发与 e2e 联调，**生产永远不会用到**，故在 nginx 层直接拦死。
    #
    # ⚠️ 为什么必须是 `~*` 正则、不能是 `location =` 字面量（2026-10-27 双端口实测）：
    #   NestJS 路由**大小写不敏感**，而 `location =` 是大小写**敏感**的字面量 ⇒ 只挡小写原样。
    #   修复前实测（8080 与 8081 同结果，均为 POST + 合法但不存在的 orderNo）：
    #     /api/v1/pay/mock/paid   → 404 nginx                      ← 只有它挡住了
    #     /api/v1/pay/MOCK/paid   → 200 {"code":30010,"订单不存在"}  ← 已穿到业务层
    #     /api/v1/pay/MoCK/paid   → 200 {"code":30010,...}
    #     /api/v1/pay/mock/PAID   → 200 {"code":30010,...}
    #     /api/v1/pay/mock/paid/  → 200 {"code":30010,...}          ← 尾斜杠同样绕过
    #     /api/v1/pay/MOCK/paid/  → 200 {"code":30010,...}
    #   30010 出自 `payAmountFenOf`，说明请求**已通过 `!isMock` 判据**并进入查单 ——
    #   换成真实单号即为 201 {"code":0}，订单被免鉴权改成已支付。
    #   `~*` 使整条路径大小写不敏感；`(/|%2f)?$` 吃掉尾斜杠与编码斜杠。
    #   `.`/`..` 点段与 `%6d` 之类字符编码由 nginx 的 complex_uri 归一化**先**处理掉，
    #   归一化后的 `$uri` 才是 location 匹配的对象 ⇒ 那两类变形被本段一并覆盖。
    #
    # ⚠️ 位置纪律：本段是**唯一的正则 location**，故放置顺序无歧义；
    #   但它是正则、优先级高于 `location /api/` 前缀匹配（后者没有 `^~`），
    #   因此**不要**给 `location /api/` 加 `^~` —— 加了本段就失效。
    #
    # 为什么用 404 而不是 403：404 由 nginx 直接返回，**不进入 Nest 路由** ⇒ 不产生业务
    # 日志、不返回任何可辨识的业务码，探测者拿不到「这里确实有东西」的信号。
    #
    # ⚠️ 维护提醒：这不是永久方案。拿到微信支付真参数后应
    #   改 `PROVIDER_MODE=real` → 删掉 `ALLOW_MOCK_IN_PROD` → 本段即可一并移除。
    location ~* ^/api/v1/pay/mock/paid(/|%2f)?$ {
        access_log off;
        return 404;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与后台同口径：微信支付 V3 回调要拿原始报文验签（Nest 侧开了 rawBody）
        proxy_request_buffering off;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }

    # ---------- ⚠️ 路径冲突：前端自己的 static/ 必须排在反代之前 ----------
    # uni-app H5 产物自带 `static/`（构建后含 static/fonts/ab-kaiti.woff2 品牌楷体），
    # 而后端也把上传目录挂在同一前缀 `/static/`（main.ts `useStaticAssets`）。
    # nginx 前缀匹配取**最长**的一条，故这里用更长前缀把前端资源留在本地，
    # 其余 /static/ 才反代给 api。
    # ⚠️ 维护提醒：将来前端若在 static/ 下新增别的子目录，**必须同步补一条**，
    #    否则那些文件会被下面的反代吃掉（表现为字体/图片 404，且日志只在 api 侧）。
    location /static/fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 本地存储的图片（STORAGE_DRIVER=local 时由 api 暴露）----------
    location /static/ {
        proxy_pass       http://api:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 静态资源 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠️ index.html 绝不缓存（同后台口径）：
    #    缓存了它，发版后浏览器会拿旧 index 去请求已删除的旧 assets → 白屏
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # ---------- SPA fallback ----------
    # uni-app H5 默认是 hash 路由，但 manifest 一旦改成 history，
    # 刷新子路由就必须回 index.html，否则 nginx 直接 404。
    # 这里提前兜住，避免将来改路由模式时踩这个坑。
    location / {
        # 换取 Cookie：带 `?gate=<凭据>` 访问 ⇒ 302 回 `/` 并种下 Cookie。
        # 302 而不是 200：把地址栏里的凭据抹掉，免得它留在浏览器历史 / 截图里。
        # ⚠️ 本段必须待在 `location` 里（`add_header` 不允许出现在 server 级 if 中，
        #    见上方「闸门生效点」的注释）；顺序上也必须**先于** try_files 生效 ——
        #    `if` 命中即 `return`，未命中才落到 try_files，这是 nginx 的标准写法。
        if ($abox_gate_grant = 1) {
            add_header Set-Cookie "abox_gate=$arg_gate; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax";
            return 302 $abox_gate_home;
        }

        # ---------- 闸门生效点（2026-10-28 从 server 级下沉到这里）----------
        # ⚠️ 只在本 location 生效：**页面**（H5 首页 / 路由页）无凭据 → 401；
        #    而 `/api/` 与 `/static/` 由各自的 location 命中，**不受本段管辖** ⇒
        #    接口鉴权靠 JWT、静态图走 `location /static/`，小程序端因此恢复正常。
        #    为何必须待在 location 而非 server：见上方「闸门生效点」注释（add_header 作用域）。
        # 顺序：必须在 try_files **之前** —— `if` 命中即 `return`，未命中才落到 try_files。
        if ($abox_gate_pass = 0) {
            return 401;
        }

        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# 闸门运维（临时访问控制 · 2026-10-27 加）
# ============================================================
#
# 【凭据文件】`deploy/h5/gate.d/gate-allow.conf`，内容就一行：
#     "<凭据>"   1;
#   两个 map 都 include 同一份 ⇒ 同一个字符串既是 Cookie 值、也是 `?gate=` 的值。
#   它**不在 git 里**（见 .gitignore），与商户私钥同级看待。
#
# 【生成 / 换凭据】（服务器 /opt/abox-onebox）
#     mkdir -p deploy/h5/gate.d
#     S=$(openssl rand -base64 18 | tr -d '=+/')
#     printf '"%s"   1;\n' "$S" > deploy/h5/gate.d/gate-allow.conf
#     echo "发给同事的链接：http://<宿主机>:8081/?gate=$S"
#     docker compose -f docker-compose.prod.yml --env-file .env.prod exec h5 nginx -s reload
#   ⚠️ 换凭据 = 所有人**立即**掉线（旧 Cookie 不再匹配），要重新发一次链接。
#   这就是「随时可踢人」的手段，不需要别的机制。
#
# 【同事怎么用】打开一次那个链接 ⇒ 302 回 `/` 并种下 30 天有效的 Cookie ⇒
#   之后正常使用。**手机 / 换浏览器都要重新开一次链接**（Cookie 不跨设备）。
#
# 【入口链接怎么发】走私聊，别贴在公开群里：链接里含凭据，
#   拿到链接 = 拿到访问权。HttpOnly + 302 抹地址栏已经做了能做的，剩下的靠分发方式。
#
# 【轮换】**每周一**轮换一次凭据（旧链接当场失效，需重新发一次）。责任人：运维。
#   `openssl rand -base64 18 | tr -d '=+/'` 生成新值 → 写文件 → `nginx -s reload` → 重新发链接。
#
# 【审计】8081 的 access log 单列一条告警：大量 401（撞门）或同一 Cookie 高频访问 ⇒ 人工看一眼。
#
# 【何时可以撤】同时满足三条：① 备案完成；② HTTPS 就绪（http 下 Cookie 明文过公网，
#   这就是它只能当**临时**措施的原因）；③ `PROVIDER_MODE` 切成 `real` 且 `ALLOW_MOCK_IN_PROD` 已删除。
#
# 【撤除期限】**备案通过后 7 天内必须撤除。责任人：运维。**
#   ⚠️ 上面第 ③ 条**不是**「H5 改用 production 构建」—— 换构建模式只掐掉端上的
#      `?devCode=` 入口，服务端 `code=dev:<任意>` 的登录口仍在
#      （`mock-wx-mini.provider.ts` 的 `/^dev:(.+)$/`）。真正的开关是 `PROVIDER_MODE=real`，
#      详见《部署运维手册》§11 R12。
#
# 【怎么撤】三处一起删，别只删一半：
#   ① 本文件上方「Cookie 闸门」的 4 个 map；② 本文件 server 里「闸门生效点」的两个 if；
#   ③ `docker-compose.prod.yml` 里 `deploy/h5/gate.d` 那行挂载。
#   然后 `... exec h5 nginx -s reload`。
#
# 【已知副作用 · 撤之前要记得处理】
#   · 切真支付后若微信回调地址落在 8081，回调不带这个 Cookie ⇒ 会拿到 401，
#     必须给 `/api/v1/pay/notify` 单独开口子（回调本身有验签做防线）。
#     **在那之前不要预先开。**
#   · 未过闸的访问一律 401 并进 `logs/nginx-h5/access.log`（带 `$request_length`）
#     ⇒ 扫端口的行为**有据可查**，这正是留证所需。
#
# 【怎么验它还在生效】`ABOX_H5_GATE='<凭据>' ./scripts/check-h5-gate.sh`
#   它同时验「未授权被拦」「错 Cookie 被拦」「授权可用」「带 Bearer 的业务请求不被误伤」
#   这四条 —— 最后一条正是基本认证方案栽掉的地方，别让它悄悄退化回去。
